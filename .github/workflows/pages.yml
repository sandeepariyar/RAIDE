name: Julkaise RAIDE GitHub Pagesiin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hae lähdekoodi
        uses: actions/checkout@v4
      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Asenna riippuvuudet
        run: npm ci
      - name: Suorita yksikkötestit
        run: npm test
      - name: Asenna Playwright-selain
        run: npx playwright install --with-deps chromium
      - name: Rakenna sovellus ja komponenttikirjasto
        run: npm run build
        env:
          RAIDE_BASE_PATH: /RAIDE/
      - name: Suorita selaimen hyväksyntätestit
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Tallenna testitulokset virhetilanteessa
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raide-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Pakkaa verkkosivusto
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Julkaise GitHub Pagesiin
        id: deployment
        uses: actions/deploy-pages@v4
