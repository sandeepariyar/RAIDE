<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">RAIDE — Raideliikenteen tilannekuva</title>
  <desc id="desc">Tummansininen raideliikenteen analytiikan kuvitus, jossa junien reitit yhdistyvät aikataulu- ja rataverkkokaavioon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0C1725"/>
      <stop offset="0.58" stop-color="#102539"/>
      <stop offset="1" stop-color="#071722"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#6AE8C6"/>
      <stop offset="1" stop-color="#3DB0D0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#7FC9F8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#7FC9F8" stop-opacity=".8"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#B5E7F8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="r"><rect width="1280" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <path d="M0 346H1280" stroke="#7BDAC7" stroke-opacity=".24"/>
    <path d="M76 54H118" stroke="#64DDC1" stroke-width="4" stroke-linecap="round"/>
    <path d="M126 54H146" stroke="#7CC8E9" stroke-width="4" stroke-linecap="round"/>
    <text x="76" y="121" font-family="'IBM Plex Sans',Inter,Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="8" fill="#F0F7FF">RAIDE</text>
    <text x="80" y="160" font-family="'IBM Plex Sans',Inter,Arial,sans-serif" font-size="19" font-weight="500" letter-spacing="1.1" fill="#82EDD6">RAIDELIIKENTEEN TILANNEKUVA</text>
    <path d="M80 187H526" stroke="#A3CCDC" stroke-opacity=".22" stroke-width="1"/>
    <text x="80" y="222" font-family="'IBM Plex Sans',Inter,Arial,sans-serif" font-size="16" fill="#B0CADA">Avoin junadata  ·  Yhtenäiset työtilat  ·  Selkeä tilannetieto</text>
    <text x="80" y="272" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" fill="#73A4B5">DESIGN  /  ENGINEERING  /  RAIL INTELLIGENCE</text>
    <rect x="80" y="302" width="178" height="27" rx="8" fill="#65DBC5" fill-opacity=".1" stroke="#65DBC5" stroke-opacity=".45"/>
    <circle cx="96" cy="315.5" r="4" fill="#68E0C4"/>
    <text x="109" y="320" font-family="'IBM Plex Sans',Inter,Arial,sans-serif" font-size="12" fill="#B9F7EA">FINNISH RAIL DATA</text>
    <text x="279" y="320" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11" fill="#7DA1B5">v1.7 · 2026</text>

