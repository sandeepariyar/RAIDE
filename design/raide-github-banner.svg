      <path d="M4 208L155 166L284 119L535 52" stroke="#77D9C3" stroke-width="12" stroke-opacity=".14" filter="url(#glow)" fill="none"/>
      <path d="M4 208L155 166L284 119L535 52" stroke="url(#accent)" stroke-width="3.5" fill="none"/>
      <path d="M20 62L145 91L253 151L430 209L542 240" stroke="#77BAEA" stroke-opacity=".7" stroke-width="2.3" fill="none"/>
      <path d="M6 107L124 130L290 148L458 165L545 190" stroke="#79A8CD" stroke-opacity=".6" stroke-width="1.8" stroke-dasharray="7 6" fill="none"/>
      <path d="M55 225L158 198L281 181L399 130L539 89" stroke="#B99CED" stroke-opacity=".65" stroke-width="2.3" fill="none"/>
      <g fill="#7CE3CB" stroke="#0B2631" stroke-width="3">
        <circle cx="155" cy="166" r="5.5"/><circle cx="284" cy="119" r="5.5"/>
      </g>
      <rect x="268" y="92" width="69" height="22" rx="6" fill="#244F59" stroke="#539B9A"/>
      <text x="282" y="107" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" fill="#C3FBEF">IC 51</text>
      <rect x="414" y="191" width="69" height="22" rx="6" fill="#1D3C5B" stroke="#4D7BA2"/>
      <text x="427" y="206" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" fill="#BCE3FF">R 9697</text>
      <path d="M321 25V260" stroke="#63D6BA" stroke-width="1.4" stroke-dasharray="4 5" stroke-opacity=".65"/>
      <rect x="303" y="252" width="36" height="5" rx="2.5" fill="#7CE3CB"/>
      <text x="20" y="264" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11" fill="#7191A6">RAIDE / VISUAL EXPLORATION</text>
